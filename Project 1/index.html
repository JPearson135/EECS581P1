<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Minesweeper</title>

<style>
    /* the best css you've ever seen */
    body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    table {
        border-collapse: collapse;
        table-layout: fixed;
        margin: 0 auto;
    }
    #board {
        align-self: center;
    }
    td {
        box-sizing: border-box;
        width: 60px;
        height: 60px;
        text-align: center;
        border: 1px solid black;
        cursor: pointer;
        font-size: 20px;
        user-select: none;
    }
    .revealed {
        background: #ddd;
    }
</style>

</head>

<body>
    <h1>Minesweeper</h1>
    <!-- mine count -->
    <label for="mineSlider">Mines: <span id="mineCount">10</span></label> 
    <!-- slider details -->
    <input
        type="range"
        id="mineSlider"
        min="10"
        max="20"
        value="10"
        oninput="document.getElementById('mineCount').textContent = this.value"
    >
    <button onclick="main()">New Game</button>
    <p id="status"></p>
    <table id="board"></table>

<script src="Minesweeper.js"></script>
</body>
</html>
