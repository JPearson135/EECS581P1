<!DOCTYPE html>
<html>
<title>Minesweeper</title>

<style>
    /* the best css you've ever seen */
    table {
        border-collapse: collapse;
    }
    td {
        width: 25px;
        height: 25px;
        text-align: center;
        border: 1px solid black;
        cursor: pointer;
    }
    .revealed {
        background: #ddd;
    }
</style>

<head>
</head>

<body>
    <h1>Minesweeper</h1>
    <!-- mine count -->
    <label for="mineSlider">Mines: <span id="mineCount">10</span></label> 
    <!-- slider details -->
    <input
        type="range"
        id="mineSlider"
        min="10"
        max="20"
        value="10"
        oninput="document.getElementById('mineCount').textContent = this.value"
    >
    <button onclick="main()">New Game</button>
    <p id="status"></p>
    <table id="board"></table>

    <p><b>Left Click:</b> Reveal Cell<br><b>Right Click:</b> Flag/Unflag Cell</p>

<script src="Minesweeper.js"></script>
</body>
</html>
