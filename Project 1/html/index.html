<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minesweeper</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #17202a;
      background: #eef2f5;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    main {
      width: min(92vw, 560px);
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    #new-game {
      padding: 7px 12px;
      border: 1px solid #9aa7b2;
      border-radius: 5px;
      background: white;
    }

    #status {
      min-height: 1.5em;
      margin: 0 0 12px;
      color: #46515b;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 3px;
    }

    .cell {
      aspect-ratio: 1;
      padding: 0;
      border: 1px solid #aeb8c1;
      border-radius: 3px;
      background: #d8e0e6;
      color: #17202a;
      font-size: clamp(0.9rem, 4vw, 1.4rem);
      font-weight: 700;
    }

    .cell:hover:not(:disabled) {
      background: #c3d0d9;
    }

    .revealed {
      background: #f8fafb;
    }

    .mine {
      background: #f2b8b5;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Minesweeper</h1>
      <button id="new-game" type="button">New game</button>
    </header>
    <p id="status">Choose a cell.</p>
    <section id="board" aria-label="Minesweeper board"></section>
  </main>

  <script src="game.js"></script>
</body>
</html>
